name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: ./mvnw -B clean package

      - name: Generate checksums
        run: |
          cd target
          sha256sum spring-analyzer-*.jar > SHA256SUMS
          for jar in spring-analyzer-*.jar; do
            sha256sum "$jar" > "$jar.sha256"
          done
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/spring-analyzer-*.jar
            target/spring-analyzer-*.jar.sha256
            target/SHA256SUMS
